<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Log Real-time</title>
    <link rel="manifest" href="data:application/manifest+json,{'name':'DriverLog','short_name':'DriverLog','start_url':'.','display':'standalone','background_color':'#ffffff','theme_color':'#2563eb'}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .edit-mode { border: 3px solid #f59e0b !important; background-color: #fffbeb !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-md mx-auto pb-24">
        <div class="bg-blue-600 p-6 rounded-b-[40px] shadow-lg mb-6 text-white">
            <h1 class="text-center font-black italic tracking-tighter text-xl mb-4 opacity-90">DRIVER LOG DASHBOARD</h1>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/20 text-center">
                    <p class="text-[10px] uppercase font-bold opacity-70">รายได้วันนี้</p>
                    <p id="todayTotal" class="text-xl font-black text-yellow-300">0 ฿</p>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/20 text-center">
                    <p class="text-[10px] uppercase font-bold opacity-70">รายได้เดือนนี้</p>
                    <p id="monthTotal" class="text-xl font-black text-green-300">0 ฿</p>
                </div>
            </div>
        </div>

        <div class="px-4 space-y-4">
            <div id="mainForm" class="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 transition-all duration-300">
                <input type="hidden" id="editId">
                <h3 id="formTitle" class="text-sm font-bold text-slate-700 mb-4 flex items-center">
                    <i class="fa-solid fa-pen-to-square mr-2 text-blue-500"></i>บันทึกข้อมูลเที่ยวรถ
                </h3>
                
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">วันที่เดินทาง</label>
                        <input type="date" id="date" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">ประเภทงาน</label>
                        <select id="type" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                            <option value="รับเข้า">📥 รับเข้า</option>
                            <option value="ส่งออก">📤 ส่งออก</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">รหัสสถานที่</label>
                        <select id="locationCode" onchange="toggleOtherCode()" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                            <option value="ป่าตอง">ป่าตอง</option>
                            <option value="เขาหลัก">เขาหลัก</option>
                            <option value="KBV">KBV</option>
                            <option value="HKT">HKT</option>
                            <option value="กะตะ กะรน">กะตะ กะรน</option>
                            <option value="เกาะลันตา">เกาะลันตา</option>
                            <option value="ปากบารา">ปากบารา</option>
                            <option value="PNK">PNK</option>
                            <option value="HDK">HDK</option>
                            <option value="SSK">SSK</option>
                            <option value="อื่นๆ">อื่นๆ...</option>
                        </select>
                    </div>
                    <div id="otherCodeBox" class="col-span-2 hidden">
                        <input type="text" id="otherCode" placeholder="พิมพ์รหัสสถานที่เอง..." class="w-full bg-yellow-50 border border-yellow-200 rounded-2xl p-3 focus:ring-2 focus:ring-yellow-500 text-sm">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">ส่งที่ไหน</label>
                    <select id="locationSelect" onchange="toggleOtherLocation()" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500 mb-2">
                        <option value="ป่าตอง">ป่าตอง</option>
                        <option value="เขาหลัก">เขาหลัก</option>
                        <option value="สนามบินภูเก็ต">สนามบินภูเก็ต</option>
                        <option value="สนามบินกระบี่">สนามบินกระบี่</option>
                        <option value="กะตะ กะรน">กะตะ กะรน</option>
                        <option value="เกาะลันตา">เกาะลันตา</option>
                        <option value="ปากบารา">ปากบารา</option>
                        <option value="Jungle Tour">Jungle Tour</option>
                        <option value="อื่นๆ">อื่นๆ (พิมพ์เอง)</option>
                    </select>
                    <input type="text" id="otherLocation" placeholder="ระบุชื่อสถานที่ละเอียด..." class="hidden w-full bg-blue-50 border border-blue-100 rounded-2xl p-3 focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <div class="mb-6">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">ค่าเที่ยว (บาท)</label>
                    <div class="relative">
                        <input type="number" id="amount" placeholder="0.00" class="w-full bg-slate-50 border-none rounded-2xl p-3 text-2xl font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 pl-10">
                        <span class="absolute left-4 top-4 text-blue-300 font-bold">฿</span>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="cancelEdit" onclick="resetForm()" class="hidden flex-1 bg-slate-200 text-slate-600 py-4 rounded-2xl font-bold">ยกเลิก</button>
                    <button id="saveBtn" onclick="saveData()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 active:scale-95 transition">
                        บันทึกข้อมูล
                    </button>
                </div>
            </div>

            <h2 class="text-lg font-bold text-slate-800 flex items-center px-2">
                <i class="fa-solid fa-calendar-days mr-2 text-blue-600"></i>สรุปรายเดือน
            </h2>
            <div id="summary" class="space-y-3"></div>

            <div class="flex justify-between items-center px-2">
                <h2 class="text-lg font-bold text-slate-800">
                    <i class="fa-solid fa-clock-rotate-left mr-2 text-blue-600"></i>ประวัติ 10 รายการล่าสุด
                </h2>
            </div>
            <div id="historyList" class="space-y-3 pb-10"></div>
        </div>
    </div>

    <script>
        // บังคับโหลดข้อมูลทันทีที่เปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            renderAll();
        });

        function toggleOtherCode() {
            const select = document.getElementById('locationCode');
            const box = document.getElementById('otherCodeBox');
            box.classList.toggle('hidden', select.value !== 'อื่นๆ');
        }

        function toggleOtherLocation() {
            const select = document.getElementById('locationSelect');
            const otherInput = document.getElementById('otherLocation');
            otherInput.classList.toggle('hidden', select.value !== 'อื่นๆ');
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('otherLocation').value = '';
            document.getElementById('otherCode').value = '';
            document.getElementById('locationCode').value = 'ป่าตอง';
            document.getElementById('locationSelect').value = 'ป่าตอง';
            document.getElementById('mainForm').classList.remove('edit-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2 text-blue-500"></i>บันทึกข้อมูลเที่ยวรถ';
            document.getElementById('saveBtn').innerText = 'บันทึกข้อมูล';
            document.getElementById('cancelEdit').classList.add('hidden');
            document.getElementById('date').valueAsDate = new Date();
            toggleOtherCode();
            toggleOtherLocation();
        }

        function saveData() {
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const amount = document.getElementById('amount').value;
            const editId = document.getElementById('editId').value;
            
            let code = document.getElementById('locationCode').value;
            if (code === 'อื่นๆ') code = document.getElementById('otherCode').value;

            let destination = document.getElementById('locationSelect').value;
            if (destination === 'อื่นๆ') destination = document.getElementById('otherLocation').value;

            if(!date || !amount || !destination || !code) return alert('กรุณากรอกข้อมูลให้ครบครับ');

            let history = JSON.parse(localStorage.getItem('driverLogsFinal') || '[]');

            if (editId) {
                const index = history.findIndex(item => item.id == editId);
                if (index !== -1) {
                    history[index] = { ...history[index], date, type, code, destination, amount: parseFloat(amount) };
                }
            } else {
                const record = { id: Date.now(), date, type, code, destination, amount: parseFloat(amount) };
                history.push(record);
            }

            localStorage.setItem('driverLogsFinal', JSON.stringify(history));
            resetForm();
            renderAll();
            alert('ดำเนินการเรียบร้อย!');
        }

        function editRecord(id) {
            const history = JSON.parse(localStorage.getItem('driverLogsFinal') || '[]');
            const item = history.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('date').value = item.date;
            document.getElementById('type').value = item.type;
            document.getElementById('amount').value = item.amount;

            // รหัสสถานที่
            const codeSelect = document.getElementById('locationCode');
            if ([...codeSelect.options].some(o => o.value === item.code)) {
                codeSelect.value = item.code;
            } else {
                codeSelect.value = 'อื่นๆ';
                document.getElementById('otherCode').value = item.code;
            }
            toggleOtherCode();

            // สถานที่ส่ง
            const locSelect = document.getElementById('locationSelect');
            if ([...locSelect.options].some(o => o.value === item.destination)) {
                locSelect.value = item.destination;
            } else {
                locSelect.value = 'อื่นๆ';
                document.getElementById('otherLocation').value = item.destination;
            }
            toggleOtherLocation();

            document.getElementById('mainForm').classList.add('edit-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-circle-exclamation mr-2 text-amber-500"></i>กำลังแก้ไขข้อมูล...';
            document.getElementById('saveBtn').innerText = 'อัปเดตข้อมูล';
            document.getElementById('cancelEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecord(id) {
            if(confirm('ยืนยันที่จะลบรายการนี้?')) {
                let history = JSON.parse(localStorage.getItem('driverLogsFinal') || '[]');
                history = history.filter(item => item.id !== id);
                localStorage.setItem('driverLogsFinal', JSON.stringify(history));
                renderAll();
            }
        }

        function renderAll() {
            const history = JSON.parse(localStorage.getItem('driverLogsFinal') || '[]');
            
            // 1. คำนวณ Dashboard Real-time
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7);
            
            let todaySum = 0;
            let monthSum = 0;
            
            history.forEach(item => {
                if(item.date === today) todaySum += item.amount;
                if(item.date.substring(0, 7) === currentMonth) monthSum += item.amount;
            });

            document.getElementById('todayTotal').innerText = todaySum.toLocaleString() + ' ฿';
            document.getElementById('monthTotal').innerText = monthSum.toLocaleString() + ' ฿';

            // 2. แสดงสรุปรายเดือน
            const monthlyData = history.reduce((acc, item) => {
                const dateObj = new Date(item.date);
                const monthKey = dateObj.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
                if (!acc[monthKey]) acc[monthKey] = { total: 0, count: 0 };
                acc[monthKey].total += item.amount;
                acc[monthKey].count += 1;
                return acc;
            }, {});

            const summaryDiv = document.getElementById('summary');
            summaryDiv.innerHTML = '';
            for (const [month, data] of Object.entries(monthlyData)) {
                summaryDiv.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <div class="text-[10px] font-bold text-slate-400 mb-1 uppercase">${month}</div>
                        <div class="flex justify-between items-center">
                            <div class="text-xl font-black text-slate-700">${data.count} <span class="text-xs font-normal">เที่ยว</span></div>
                            <div class="text-xl font-black text-blue-600">${data.total.toLocaleString()} ฿</div>
                        </div>
                    </div>`;
            }

            // 3. แสดงประวัติ 10 รายการล่าสุด
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = [...history].reverse().slice(0, 10).map(item => `
                <div class="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <div class="bg-blue-100 text-blue-700 w-10 h-10 rounded-2xl flex items-center justify-center font-black text-[10px]">${item.code}</div>
                        <div>
                            <div class="text-sm font-bold text-slate-800">${item.destination}</div>
                            <div class="text-[10px] text-slate-400 font-bold">${new Date(item.date).toLocaleDateString('th-TH')} • ${item.type}</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="text-sm font-black text-slate-700 mr-2">${item.amount.toLocaleString()}฿</div>
                        <button onclick="editRecord(${item.id})" class="text-blue-400 p-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteRecord(${item.id})" class="text-red-300 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
