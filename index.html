<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Log Pro</title>
    
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'Driver Log Pro',
        'short_name': 'DriverLog',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#f8fafc',
        'theme_color': '#2563eb',
        'icons': [{
            'src': 'icon.png',
            'sizes': '512x512',
            'type': 'image/png'
        }]
    }">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- SheetJS Library สำหรับ Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .edit-mode { border: 3px solid #f59e0b !important; background-color: #fffbeb !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.01); } }
        .btn-active:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-md mx-auto pb-32">
        <div class="bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700 p-8 rounded-b-[50px] shadow-2xl mb-8 text-white relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            <h1 class="text-center font-black italic tracking-widest text-2xl mb-6 flex items-center justify-center">
                <i class="fa-solid fa-truck-fast mr-3"></i> DRIVER LOG PRO
            </h1>
            <div class="grid grid-cols-2 gap-4 relative z-10">
                <div class="bg-white/15 p-4 rounded-[2rem] border border-white/20 text-center shadow-inner">
                    <p class="text-[11px] uppercase font-bold text-blue-100 mb-1 tracking-tighter">รายได้วันนี้</p>
                    <p id="todayTotal" class="text-2xl font-black text-yellow-300">0 ฿</p>
                </div>
                <div class="bg-white/15 p-4 rounded-[2rem] border border-white/20 text-center shadow-inner">
                    <p class="text-[11px] uppercase font-bold text-blue-100 mb-1 tracking-tighter">รายได้เดือนนี้</p>
                    <p id="monthTotal" class="text-2xl font-black text-green-300">0 ฿</p>
                </div>
            </div>
        </div>

        <div class="px-5 space-y-6">
            <div id="mainForm" class="bg-white rounded-[2.5rem] shadow-xl p-7 border border-slate-100 transition-all duration-500">
                <input type="hidden" id="editId">
                <h3 id="formTitle" class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <i class="fa-solid fa-file-circle-plus mr-2 text-blue-600"></i> บันทึกเที่ยวรถ
                </h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2">วันที่เดินทาง</label>
                        <input type="date" id="date" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 outline-none focus:border-blue-500">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2">ประเภทงาน</label>
                            <select id="type" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 outline-none">
                                <option value="รับเข้า">📥 รับเข้า</option>
                                <option value="ส่งออก">📤 ส่งออก</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2">รหัสสถานที่</label>
                            <select id="locationCode" onchange="toggleOtherCode()" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 outline-none">
                                <option value="PNK">PNK</option>
                                <option value="SSK">SSK</option>
                                <option value="HDK">HDK</option>
                                <option value="HKT">HKT</option>
                                <option value="KBV">KBV</option>
                                <option value="ป่าตอง">ป่าตอง</option>
                                <option value="เขาหลัก">เขาหลัก</option>
                                <option value="เกาะลันตา">เกาะลันตา</option>
                                <option value="by hour">by hour</option>
                                <option value="อื่นๆ">อื่นๆ...</option>
                            </select>
                        </div>
                    </div>

                    <input type="text" id="otherCode" placeholder="ระบุรหัสสถานที่เอง..." class="hidden w-full bg-amber-50 border-2 border-amber-100 rounded-2xl p-4 outline-none text-sm">

                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2">ส่งที่ไหน</label>
                        <select id="locationSelect" onchange="toggleOtherLocation()" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 outline-none mb-3">
                            <option value="PNK">PNK</option>
                            <option value="SSK">SSK</option>
                            <option value="HDK">HDK</option>
                            <option value="HKT">HKT</option>
                            <option value="KBV">KBV</option>
                            <option value="ป่าตอง">ป่าตอง</option>
                            <option value="เขาหลัก">เขาหลัก</option>
                            <option value="เกาะลันตา">เกาะลันตา</option>
                            <option value="by hour">by hour</option>
                            <option value="อื่นๆ">อื่นๆ (พิมพ์เอง)</option>
                        </select>
                        <input type="text" id="otherLocation" placeholder="ระบุชื่อสถานที่ละเอียด..." class="hidden w-full bg-blue-50 border-2 border-blue-100 rounded-2xl p-4 outline-none text-sm">
                    </div>

                    <div class="relative">
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2">ค่าเที่ยว (บาท)</label>
                        <input type="number" id="amount" placeholder="0.00" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-3xl font-black text-blue-600 outline-none pl-12">
                        <span class="absolute left-5 top-11 text-blue-300 font-black text-xl">฿</span>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button id="cancelEdit" onclick="resetForm()" class="hidden flex-1 bg-slate-200 text-slate-600 py-4 rounded-2xl font-bold btn-active">ยกเลิก</button>
                        <button id="saveBtn" onclick="saveData()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg btn-active hover:bg-blue-700 transition-all">บันทึกข้อมูล</button>
                    </div>
                </div>
            </div>

            <!-- ส่วนหัวสรุปผลงาน + ปุ่ม Export Excel -->
            <div class="flex justify-between items-center px-2">
                <h2 class="text-xl font-black text-slate-800 flex items-center">
                    <i class="fa-solid fa-chart-line mr-2 text-blue-600"></i> สรุปผลงาน
                </h2>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-md flex items-center gap-2 btn-active">
                    <i class="fa-solid fa-file-excel text-sm"></i> ส่งออก Excel
                </button>
            </div>
            <div id="summary" class="space-y-3"></div>

            <div class="flex justify-between items-center px-2">
                <h2 class="text-xl font-black text-slate-800 flex items-center">
                    <i class="fa-solid fa-clock-rotate-left mr-2 text-blue-600"></i> ประวัติรายการ
                </h2>
                <span id="recordCount" class="text-xs font-bold text-slate-400">0 รายการ</span>
            </div>
            <div id="historyList" class="space-y-3"></div>
            
            <div id="clearAllArea" class="pt-6 hidden">
                <button onclick="clearAllData()" class="w-full bg-red-50 text-red-500 py-4 rounded-2xl font-bold border-2 border-dashed border-red-200 btn-active">ล้างข้อมูลทั้งหมด</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            renderAll();
        });

        function toggleOtherCode() {
            const select = document.getElementById('locationCode');
            document.getElementById('otherCode').classList.toggle('hidden', select.value !== 'อื่นๆ');
        }

        function toggleOtherLocation() {
            const select = document.getElementById('locationSelect');
            document.getElementById('otherLocation').classList.toggle('hidden', select.value !== 'อื่นๆ');
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('otherLocation').value = '';
            document.getElementById('otherCode').value = '';
            document.getElementById('locationCode').value = 'PNK';
            document.getElementById('locationSelect').value = 'PNK';
            document.getElementById('mainForm').classList.remove('edit-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-file-circle-plus mr-2 text-blue-600"></i> บันทึกเที่ยวรถ';
            document.getElementById('saveBtn').innerText = 'บันทึกข้อมูล';
            document.getElementById('cancelEdit').classList.add('hidden');
            document.getElementById('date').valueAsDate = new Date();
            toggleOtherCode();
            toggleOtherLocation();
        }

        function saveData() {
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const amount = document.getElementById('amount').value;
            const editId = document.getElementById('editId').value;
            
            let code = document.getElementById('locationCode').value;
            if (code === 'อื่นๆ') code = document.getElementById('otherCode').value;

            let destination = document.getElementById('locationSelect').value;
            if (destination === 'อื่นๆ') destination = document.getElementById('otherLocation').value;

            if(!date || !amount || (destination === '' && document.getElementById('locationSelect').value === 'อื่นๆ')) {
                return alert('กรุณากรอกข้อมูลให้ครบนะครับ Bird!');
            }

            let history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');

            if (editId) {
                const index = history.findIndex(item => item.id == editId);
                if (index !== -1) {
                    history[index] = { ...history[index], date, type, code, destination, amount: parseFloat(amount) };
                }
            } else {
                const record = { id: Date.now(), date, type, code, destination, amount: parseFloat(amount) };
                history.push(record);
            }

            localStorage.setItem('driverLogsUltra', JSON.stringify(history));
            resetForm();
            renderAll();
        }

        function editRecord(id) {
            const history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
            const item = history.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('date').value = item.date;
            document.getElementById('type').value = item.type;
            document.getElementById('amount').value = item.amount;
            
            const codeSel = document.getElementById('locationCode');
            if ([...codeSel.options].some(o => o.value === item.code)) {
                codeSel.value = item.code;
            } else {
                codeSel.value = 'อื่นๆ';
                document.getElementById('otherCode').value = item.code;
                document.getElementById('otherCode').classList.remove('hidden');
            }

            const locSel = document.getElementById('locationSelect');
            if ([...locSel.options].some(o => o.value === item.destination)) {
                locSel.value = item.destination;
            } else {
                locSel.value = 'อื่นๆ';
                document.getElementById('otherLocation').value = item.destination;
                document.getElementById('otherLocation').classList.remove('hidden');
            }

            document.getElementById('mainForm').classList.add('edit-mode');
            document.getElementById('formTitle').innerText = '📝 กำลังแก้ไขข้อมูล...';
            document.getElementById('saveBtn').innerText = 'อัปเดตข้อมูล';
            document.getElementById('cancelEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecord(id) {
            if(confirm('ต้องการลบรายการนี้ใช่ไหมครับ?')) {
                let history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
                history = history.filter(item => item.id !== id);
                localStorage.setItem('driverLogsUltra', JSON.stringify(history));
                renderAll();
            }
        }

        function clearAllData() {
            if(confirm('ลบข้อมูลทั้งหมด? ไม่สามารถกู้คืนได้นะ!')) {
                localStorage.removeItem('driverLogsUltra');
                renderAll();
            }
        }

        // ฟังก์ชันสำหรับส่งออกไฟล์ Excel
        function exportToExcel() {
            const history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
            if (history.length === 0) {
                return alert('ไม่มีข้อมูลสำหรับส่งออก!');
            }

            // เรียงลำดับตามวันที่
            const sortedHistory = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));

            // ตารางประวัติรายการ
            const excelData = sortedHistory.map((item, index) => ({
                'ลำดับ': index + 1,
                'วันที่': new Date(item.date).toLocaleDateString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit' }),
                'ประเภทงาน': item.type,
                'รหัสสถานที่': item.code,
                'สถานที่ส่ง/ปลายทาง': item.destination,
                'ค่าเที่ยว (บาท)': item.amount
            }));

            // คำนวณสรุปรายเดือน
            const monthlySummary = sortedHistory.reduce((acc, item) => {
                const month = new Date(item.date).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
                if (!acc[month]) acc[month] = { count: 0, total: 0 };
                acc[month].count += 1;
                acc[month].total += parseFloat(item.amount);
                return acc;
            }, {});

            const summaryData = Object.entries(monthlySummary).map(([month, data]) => ({
                'เดือน': month,
                'จำนวนเที่ยว': data.count,
                'ยอดรวมรายได้ (บาท)': data.total
            }));

            const grandTotal = sortedHistory.reduce((sum, item) => sum + parseFloat(item.amount), 0);
            summaryData.push({
                'เดือน': 'รวมทั้งหมด',
                'จำนวนเที่ยว': sortedHistory.length,
                'ยอดรวมรายได้ (บาท)': grandTotal
            });

            // สร้าง Workbook
            const wb = XLSX.utils.book_new();
            
            // Sheet 1: รายการทั้งหมด
            const wsDetail = XLSX.utils.json_to_sheet(excelData);
            XLSX.utils.book_append_sheet(wb, wsDetail, "ประวัติการวิ่งรถ");

            // Sheet 2: สรุปรายเดือน
            const wsSummary = XLSX.utils.json_to_sheet(summaryData);
            XLSX.utils.book_append_sheet(wb, wsSummary, "สรุปรายเดือน");

            // บันทึกไฟล์ Excel
            const todayStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `Driver_Log_Report_${todayStr}.xlsx`);
        }

        function renderAll() {
            const history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7);
            
            let todaySum = 0;
            let monthSum = 0;
            let grandTotal = 0; // สะสมยอดรวมทั้งหมด
            
            history.forEach(item => {
                const itemAmount = parseFloat(item.amount);
                grandTotal += itemAmount;
                if(item.date === today) todaySum += itemAmount;
                if(item.date.substring(0, 7) === currentMonth) monthSum += itemAmount;
            });

            document.getElementById('todayTotal').innerText = todaySum.toLocaleString() + ' ฿';
            document.getElementById('monthTotal').innerText = monthSum.toLocaleString() + ' ฿';
            document.getElementById('recordCount').innerText = `${history.length} รายการ`;
            document.getElementById('clearAllArea').classList.toggle('hidden', history.length === 0);

            // คำนวณแยกตามเดือน
            const monthlyObj = history.reduce((acc, item) => {
                const month = new Date(item.date).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
                if(!acc[month]) acc[month] = 0;
                acc[month] += parseFloat(item.amount);
                return acc;
            }, {});

            let summaryHTML = '';
            
            // 1. แสดงยอดรายเดือน
            summaryHTML += Object.entries(monthlyObj).map(([month, sum]) => `
                <div class="bg-white p-4 rounded-3xl shadow-sm flex justify-between items-center border border-slate-50">
                    <span class="font-bold text-slate-600">${month}</span>
                    <span class="text-xl font-black text-blue-600">${sum.toLocaleString()} ฿</span>
                </div>
            `).join('');

            // 2. แสดงยอดรวมทั้งหมด (ถ้ามีข้อมูล)
            if (history.length > 0) {
                summaryHTML += `
                    <div class="bg-gradient-to-r from-orange-400 to-orange-500 p-5 rounded-3xl shadow-md flex justify-between items-center text-white mt-4">
                        <div>
                            <p class="text-[10px] font-bold uppercase opacity-80">ยอดรวมสะสมทั้งหมด</p>
                            <p class="text-sm font-bold">ทุกรายการที่บันทึก</p>
                        </div>
                        <span class="text-2xl font-black">${grandTotal.toLocaleString()} ฿</span>
                    </div>
                `;
            }

            document.getElementById('summary').innerHTML = summaryHTML;

            const listDiv = document.getElementById('historyList');
            if (history.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-slate-300 py-10 font-bold">ไม่มีประวัติการบันทึก</p>';
                return;
            }

            listDiv.innerHTML = [...history].reverse().map(item => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-50 flex justify-between items-center relative overflow-hidden">
                    <div class="absolute left-0 top-0 h-full w-1.5 bg-blue-500"></div>
                    <div>
                        <div class="text-sm font-bold text-slate-800">${item.destination}</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">
                            ${new Date(item.date).toLocaleDateString('th-TH')} • ${item.code} • ${item.type}
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div class="font-black text-slate-700">${parseFloat(item.amount).toLocaleString()}฿</div>
                        </div>
                        <button onclick="editRecord(${item.id})" class="w-8 h-8 rounded-lg bg-amber-50 text-amber-500 flex items-center justify-center btn-active"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteRecord(${item.id})" class="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center btn-active"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
