<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Log Ultra</title>
    <link rel="manifest" href="data:application/manifest+json,{'name':'DriverLog','short_name':'DriverLog','start_url':'.','display':'standalone','background_color':'#f8fafc','theme_color':'#2563eb'}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .edit-mode { border: 3px solid #f59e0b !important; background-color: #fffbeb !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.01); } 100% { transform: scale(1); } }
        .btn-active:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-md mx-auto pb-32">
        <div class="bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700 p-8 rounded-b-[50px] shadow-2xl mb-8 text-white relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            <h1 class="text-center font-black italic tracking-widest text-2xl mb-6 flex items-center justify-center">
                <i class="fa-solid fa-truck-fast mr-3"></i> DRIVER LOG PRO
            </h1>
            <div class="grid grid-cols-2 gap-4 relative z-10">
                <div class="bg-white/15 p-4 rounded-[2rem] border border-white/20 text-center shadow-inner">
                    <p class="text-[11px] uppercase font-bold text-blue-100 mb-1">รายได้วันนี้</p>
                    <p id="todayTotal" class="text-2xl font-black text-yellow-300">0 ฿</p>
                </div>
                <div class="bg-white/15 p-4 rounded-[2rem] border border-white/20 text-center shadow-inner">
                    <p class="text-[11px] uppercase font-bold text-blue-100 mb-1">รายได้เดือนนี้</p>
                    <p id="monthTotal" class="text-2xl font-black text-green-300">0 ฿</p>
                </div>
            </div>
        </div>

        <div class="px-5 space-y-6">
            <div id="mainForm" class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/60 p-7 border border-slate-100 transition-all duration-500">
                <input type="hidden" id="editId">
                <div class="flex items-center justify-between mb-6">
                    <h3 id="formTitle" class="text-lg font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-file-pen mr-2 text-blue-600"></i> บันทึกรายการใหม่
                    </h3>
                    <span class="bg-blue-50 text-blue-600 text-[10px] px-3 py-1 rounded-full font-bold uppercase">Work Log</span>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-wider">วันที่เดินทาง</label>
                        <input type="date" id="date" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition-all outline-none">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-wider">ประเภทงาน</label>
                            <select id="type" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-blue-500 transition-all outline-none appearance-none">
                                <option value="รับเข้า">📥 รับเข้า</option>
                                <option value="ส่งออก">📤 ส่งออก</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-wider">รหัสสถานที่</label>
                            <select id="locationCode" onchange="toggleOtherCode()" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-blue-500 transition-all outline-none">
                                <option value="ป่าตอง">ป่าตอง</option>
                                <option value="เขาหลัก">เขาหลัก</option>
                                <option value="KBV">KBV</option>
                                <option value="HKT">HKT</option>
                                <option value="กะตะ กะรน">กะตะ กะรน</option>
                                <option value="เกาะลันตา">เกาะลันตา</option>
                                <option value="ปากบารา">ปากบารา</option>
                                <option value="PNK">PNK</option>
                                <option value="HDK">HDK</option>
                                <option value="SSK">SSK</option>
                                <option value="อื่นๆ">อื่นๆ...</option>
                            </select>
                        </div>
                    </div>

                    <input type="text" id="otherCode" placeholder="ระบุรหัสสถานที่เอง..." class="hidden w-full bg-amber-50 border-2 border-amber-100 rounded-2xl p-4 focus:border-amber-400 outline-none text-sm">

                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-wider">ส่งที่ไหน</label>
                        <select id="locationSelect" onchange="toggleOtherLocation()" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-blue-500 outline-none mb-3">
                            <option value="ป่าตอง">ป่าตอง</option>
                            <option value="เขาหลัก">เขาหลัก</option>
                            <option value="สนามบินภูเก็ต">สนามบินภูเก็ต</option>
                            <option value="สนามบินกระบี่">สนามบินกระบี่</option>
                            <option value="กะตะ กะรน">กะตะ กะรน</option>
                            <option value="เกาะลันตา">เกาะลันตา</option>
                            <option value="ปากบารา">ปากบารา</option>
                            <option value="Jungle Tour">Jungle Tour</option>
                            <option value="อื่นๆ">อื่นๆ (พิมพ์เอง)</option>
                        </select>
                        <input type="text" id="otherLocation" placeholder="ระบุชื่อสถานที่ละเอียด..." class="hidden w-full bg-blue-50 border-2 border-blue-100 rounded-2xl p-4 focus:border-blue-500 outline-none text-sm animate-pulse">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-wider">ค่าเที่ยว (บาท)</label>
                        <div class="relative">
                            <input type="number" id="amount" placeholder="0.00" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-3xl font-black text-blue-600 focus:border-blue-500 outline-none pl-12 shadow-inner">
                            <span class="absolute left-5 top-5 text-blue-300 font-bold text-xl font-black">฿</span>
                        </div>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button id="cancelEdit" onclick="resetForm()" class="hidden flex-1 bg-slate-200 text-slate-600 py-4 rounded-2xl font-bold btn-active transition-all">ยกเลิก</button>
                        <button id="saveBtn" onclick="saveData()" class="flex-[2] bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg shadow-blue-200 btn-active transition-all hover:bg-blue-700">
                            บันทึกข้อมูล <i class="fa-solid fa-paper-plane ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xl font-black text-slate-800 flex items-center px-2">
                    <i class="fa-solid fa-chart-column mr-3 text-blue-600"></i> สรุปผลงาน
                </h2>
                <div id="summary" class="grid grid-cols-1 gap-3"></div>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-end px-2">
                    <h2 class="text-xl font-black text-slate-800 flex items-center">
                        <i class="fa-solid fa-history mr-3 text-blue-600"></i> รายการทั้งหมด
                    </h2>
                    <span id="recordCount" class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">0 รายการ</span>
                </div>
                <div id="historyList" class="space-y-3"></div>
                
                <div id="clearAllArea" class="pt-6 pb-12 hidden">
                    <button onclick="clearAllData()" class="w-full bg-red-50 text-red-500 py-4 rounded-2xl font-bold border-2 border-dashed border-red-200 hover:bg-red-500 hover:text-white transition-all btn-active">
                        <i class="fa-solid fa-trash-can-arrow-up mr-2"></i> ลบข้อมูลทั้งหมด
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            renderAll();
        });

        function toggleOtherCode() {
            const select = document.getElementById('locationCode');
            const box = document.getElementById('otherCodeBox');
            document.getElementById('otherCode').classList.toggle('hidden', select.value !== 'อื่นๆ');
        }

        function toggleOtherLocation() {
            const select = document.getElementById('locationSelect');
            document.getElementById('otherLocation').classList.toggle('hidden', select.value !== 'อื่นๆ');
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('otherLocation').value = '';
            document.getElementById('otherCode').value = '';
            document.getElementById('locationCode').value = 'ป่าตอง';
            document.getElementById('locationSelect').value = 'ป่าตอง';
            document.getElementById('mainForm').classList.remove('edit-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-file-pen mr-2 text-blue-600"></i> บันทึกรายการใหม่';
            document.getElementById('saveBtn').innerText = 'บันทึกข้อมูล';
            document.getElementById('cancelEdit').classList.add('hidden');
            document.getElementById('date').valueAsDate = new Date();
            toggleOtherCode();
            toggleOtherLocation();
        }

        function saveData() {
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const amount = document.getElementById('amount').value;
            const editId = document.getElementById('editId').value;
            
            let code = document.getElementById('locationCode').value;
            if (code === 'อื่นๆ') code = document.getElementById('otherCode').value;

            let destination = document.getElementById('locationSelect').value;
            if (destination === 'อื่นๆ') destination = document.getElementById('otherLocation').value;

            if(!date || !amount || !destination || !code) return alert('กรุณากรอกข้อมูลให้ครบนะครับ Bird!');

            let history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');

            if (editId) {
                const index = history.findIndex(item => item.id == editId);
                if (index !== -1) {
                    history[index] = { ...history[index], date, type, code, destination, amount: parseFloat(amount) };
                }
            } else {
                const record = { id: Date.now(), date, type, code, destination, amount: parseFloat(amount) };
                history.push(record);
            }

            localStorage.setItem('driverLogsUltra', JSON.stringify(history));
            resetForm();
            renderAll();
        }

        function editRecord(id) {
            const history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
            const item = history.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('date').value = item.date;
            document.getElementById('type').value = item.type;
            document.getElementById('amount').value = item.amount;

            const codeSelect = document.getElementById('locationCode');
            if ([...codeSelect.options].some(o => o.value === item.code)) {
                codeSelect.value = item.code;
            } else {
                codeSelect.value = 'อื่นๆ';
                document.getElementById('otherCode').value = item.code;
                document.getElementById('otherCode').classList.remove('hidden');
            }

            const locSelect = document.getElementById('locationSelect');
            if ([...locSelect.options].some(o => o.value === item.destination)) {
                locSelect.value = item.destination;
            } else {
                locSelect.value = 'อื่นๆ';
                document.getElementById('otherLocation').value = item.destination;
                document.getElementById('otherLocation').classList.remove('hidden');
            }

            document.getElementById('mainForm').classList.add('edit-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-circle-exclamation mr-2 text-amber-500"></i> กำลังแก้ไขรายการ';
            document.getElementById('saveBtn').innerText = 'อัปเดตข้อมูล';
            document.getElementById('cancelEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecord(id) {
            if(confirm('ต้องการลบรายการนี้ใช่ไหมครับ?')) {
                let history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
                history = history.filter(item => item.id !== id);
                localStorage.setItem('driverLogsUltra', JSON.stringify(history));
                renderAll();
            }
        }

        function clearAllData() {
            if(confirm('ระวัง! คุณต้องการลบข้อมูลทั้งหมดทิ้งใช่หรือไม่? การกระทำนี้กู้คืนไม่ได้นะครับ')) {
                localStorage.removeItem('driverLogsUltra');
                renderAll();
                alert('ล้างข้อมูลเรียบร้อยแล้วครับ');
            }
        }

        function renderAll() {
            const history = JSON.parse(localStorage.getItem('driverLogsUltra') || '[]');
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7);
