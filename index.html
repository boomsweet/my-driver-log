<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Log Pro V4</title>
    <link rel="manifest" href="data:application/manifest+json,{'name':'DriverLog','short_name':'DriverLog','start_url':'.','display':'standalone','background_color':'#ffffff','theme_color':'#2563eb'}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .edit-mode { border: 2px solid #eab308 !important; background-color: #fefce8 !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-md mx-auto pb-24">
        <div class="bg-blue-600 p-6 rounded-b-[40px] shadow-lg mb-6 relative">
            <h1 class="text-white text-2xl font-bold text-center italic tracking-wider">DRIVER LOG PRO <span class="text-yellow-400 text-xs align-top">V4</span></h1>
            <p class="text-blue-100 text-center text-xs mt-1 opacity-80">บันทึกง่าย แก้ไขสะดวก เพื่อคนขับรถมืออาชีพ</p>
        </div>

        <div class="px-4 space-y-4">
            <div id="mainForm" class="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 transition-all duration-300">
                <input type="hidden" id="editId">
                
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">วันที่เดินทาง</label>
                        <input type="date" id="date" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">ประเภทงาน</label>
                        <select id="type" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                            <option value="รับเข้า">📥 รับเข้า</option>
                            <option value="ส่งออก">📤 ส่งออก</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">รหัสสถานที่</label>
                        <select id="locationCode" onchange="toggleOtherCode()" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                            <option value="ป่าตอง">ป่าตอง</option>
                            <option value="เขาหลัก">เขาหลัก</option>
                            <option value="KBV">KBV</option>
                            <option value="HKT">HKT</option>
                            <option value="กะตะ กะรน">กะตะ กะรน</option>
                            <option value="เกาะลันตา">เกาะลันตา</option>
                            <option value="ปากบารา">ปากบารา</option>
                            <option value="PNK">PNK</option>
                            <option value="HDK">HDK</option>
                            <option value="SSK">SSK</option>
                            <option value="อื่นๆ">อื่นๆ...</option>
                        </select>
                    </div>
                    <div id="otherCodeBox" class="col-span-2 hidden">
                        <input type="text" id="otherCode" placeholder="พิมพ์รหัสสถานที่เอง..." class="w-full bg-yellow-50 border border-yellow-200 rounded-2xl p-3 focus:ring-2 focus:ring-yellow-500">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">ส่งที่ไหน (ระบุชื่อที่พัก/จุดส่ง)</label>
                    <select id="locationSelect" onchange="toggleOtherLocation()" class="w-full bg-slate-50 border-none rounded-2xl p-3 focus:ring-2 focus:ring-blue-500 mb-2">
                        <option value="ป่าตอง">ป่าตอง</option>
                        <option value="เขาหลัก">เขาหลัก</option>
                        <option value="สนามบินภูเก็ต">สนามบินภูเก็ต</option>
                        <option value="สนามบินกระบี่">สนามบินกระบี่</option>
                        <option value="กะตะ กะรน">กะตะ กะรน</option>
                        <option value="เกาะลันตา">เกาะลันตา</option>
                        <option value="ปากบารา">ปากบารา</option>
                        <option value="Jungle Tour">Jungle Tour</option>
                        <option value="อื่นๆ">อื่นๆ (พิมพ์เอง)</option>
                    </select>
                    <input type="text" id="otherLocation" placeholder="ระบุชื่อสถานที่ละเอียด..." class="hidden w-full bg-blue-50 border border-blue-100 rounded-2xl p-3 focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-6">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">ค่าเที่ยว (บาท)</label>
                    <div class="relative">
                        <input type="number" id="amount" placeholder="0.00" class="w-full bg-slate-50 border-none rounded-2xl p-3 text-2xl font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 pl-10">
                        <span class="absolute left-4 top-4 text-blue-300 font-bold">฿</span>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="cancelEdit" onclick="resetForm()" class="hidden flex-1 bg-slate-200 text-slate-600 py-4 rounded-2xl font-bold">ยกเลิก</button>
                    <button id="saveBtn" onclick="saveData()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition">
                        <i class="fa-solid fa-floppy-disk mr-2"></i>บันทึกข้อมูล
                    </button>
                </div>
            </div>

            <h2 class="text-lg font-bold text-slate-800 flex items-center px-2 mt-4">
                <i class="fa-solid fa-chart-line mr-2 text-blue-600"></i>สรุปรายเดือน
            </h2>
            <div id="summary" class="space-y-3"></div>

            <div class="flex justify-between items-center px-2 mt-4">
                <h2 class="text-lg font-bold text-slate-800">
                    <i class="fa-solid fa-list-check mr-2 text-blue-600"></i>ประวัติล่าสุด
                </h2>
                <span class="text-[10px] text-slate-400 font-bold uppercase">10 รายการล่าสุด</span>
            </div>
            <div id="historyList" class="space-y-3 pb-10"></div>
        </div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        function toggleOtherCode() {
            const select = document.getElementById('locationCode');
            const box
