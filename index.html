<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกค่าเที่ยวรถ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold mb-4 text-blue-700 text-center">บันทึกค่าเที่ยวรถ 🚛</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">วันที่/เดือน/พ.ศ.</label>
                <input type="date" id="date" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ประเภทงาน</label>
                <select id="type" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
                    <option value="รับเข้า">📥 รับเข้า</option>
                    <option value="ส่งออก">📤 ส่งออก</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">สถานที่</label>
                <select id="location" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
                    <option value="PNK">PNK</option>
                    <option value="HDK">HDK</option>
                    <option value="SSK">SSK</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ค่าเที่ยว (บาท)</label>
                <input type="number" id="amount" placeholder="ระบุจำนวนเงิน" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
            </div>

            <button onclick="saveData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold transition">บันทึกข้อมูล</button>
        </div>

        <hr class="my-6">

        <h2 class="text-lg font-bold mb-3 text-gray-800">สรุปรายเดือน (พ.ศ.)</h2>
        <div id="summary" class="space-y-3">
            </div>
    </div>

    <script>
        function saveData() {
            const dateInput = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const location = document.getElementById('location').value;
            const amount = document.getElementById('amount').value;

            if(!dateInput || !amount) return alert('กรุณากรอกข้อมูลให้ครบครับ');

            const record = {
                date: dateInput,
                type: type,
                location: location,
                amount: parseFloat(amount)
            };

            let history = JSON.parse(localStorage.getItem('truckLogs') || '[]');
            history.push(record);
            localStorage.setItem('truckLogs', JSON.stringify(history));

            alert('บันทึกเรียบร้อย!');
            renderSummary();
            document.getElementById('amount').value = ''; // เคลียร์ช่องเงินหลังเซฟ
        }

        function renderSummary() {
            const history = JSON.parse(localStorage.getItem('truckLogs') || '[]');
            const summaryDiv = document.getElementById('summary');
            
            // จัดกลุ่มตามเดือน
            const monthlyData = history.reduce((acc, item) => {
                const dateObj = new Date(item.date);
                const monthName = dateObj.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
                if (!acc[monthName]) acc[monthName] = { total: 0, count: 0 };
                acc[monthName].total += item.amount;
                acc[monthName].count += 1;
                return acc;
            }, {});

            summaryDiv.innerHTML = '';
            
            // แสดงผลสรุป
            for (const [month, data] of Object.entries(monthlyData)) {
                summaryDiv.innerHTML += `
                    <div class="p-4 bg-blue-50 rounded-lg border border-blue-100 shadow-sm">
                        <div class="font-bold text-blue-800">${month}</div>
                        <div class="flex justify-between text-sm text-gray-600 mt-1">
                            <span>วิ่งทั้งหมด: ${data.count} เที่ยว</span>
                            <span class="font-bold text-green-600">${data.total.toLocaleString()} บาท</span>
                        </div>
                    </div>
                `;
            }
        }

        // โหลดข้อมูลเมื่อเปิดเว็บ
        window.onload = renderSummary;
    </script>
</body>
</html>
